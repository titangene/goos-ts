name: CI

on:
  push:
    branches: [main, poc]
  pull_request:
    branches: [main, poc]

jobs:
  ci:
    name: Lint, Format, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ADR-0008：拍賣協定用 XMPP（Prosody），CI 需要一個真實的 Prosody
      # server 給整合測試/e2e 用（見 docker/xmpp/）。GitHub Actions 的
      # services: 只能拉預先建置好的 image，這裡的 image 需要自己 build，
      # 所以改用 docker build/run 兩個步驟，不用 services: 區塊。
      - name: Build and start Prosody
        run: |
          docker build -t prosody-ci docker/xmpp
          docker run -d --name prosody -p 5280:5280 \
            -e PROSODY_ENABLE_MODULES=websocket \
            -e PROSODY_VIRTUAL_HOSTS=localhost \
            prosody-ci
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5280/; then
              exit 0
            fi
            sleep 1
          done
          echo "Prosody did not become ready in time" >&2
          docker logs prosody
          exit 1

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Integration tests (app)
        run: npm run test:integration:app

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e
