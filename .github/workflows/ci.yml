name: CI

on:
  push:
    branches: [main, poc]
  pull_request:
    branches: [main, poc]

jobs:
  ci:
    name: Lint, Format, Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ADR-0005: GitHub Actions `services:` 容器會在 checkout 之前啟動，無法掛載
      # repo 裡的 mosquitto/mosquitto.conf，所以改在 checkout 之後手動啟動，
      # 並等待兩個 listener（1883 內部 TCP、9001 對外 WS）都能連上才繼續。
      - name: Build and start Mosquitto
        run: |
          docker build -t goos-mosquitto ./mosquitto
          docker run -d --name goos-mosquitto -p 1883:1883 -p 9001:9001 goos-mosquitto
          timeout 30 bash -c 'until echo > /dev/tcp/127.0.0.1/1883; do sleep 1; done'
          timeout 30 bash -c 'until echo > /dev/tcp/127.0.0.1/9001; do sleep 1; done'

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Integration tests (app)
        run: npm run test:integration:app

      - name: E2E tests
        run: npm run test:e2e
