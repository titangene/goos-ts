# ADR-0004: MQTT Broker 部署為獨立 Render Web Service
# ADR-0006: MQTT Topic 拓樸設計——分離 Commands/Events Topic
# 見 docs/adr/ADR-0004-mqtt-broker-deployment.md、docs/adr/ADR-0006-mqtt-topic-topology.md

# 內部 MQTT TCP listener：本機開發、CI、以及部署後 Nuxt server 透過私有網路連線
listener 1883
protocol mqtt

# 對外 MQTT-over-WebSocket listener：本機端 `fake-auction.ts --remote` 用來連部署環境
# 部署到 Render 時，此 port 需對應 Render 的 PORT 環境變數（見 ADR-0004，於 Task #9 處理）
listener 9001
protocol websockets

# ADR-0003：身分驗證由應用層的 username 白名單負責，broker 本身不做帳密驗證
allow_anonymous true
